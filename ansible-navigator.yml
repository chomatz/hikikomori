---

ansible-navigator:
  execution-environment:
    container-engine: podman
    container-options:
      - "--net=host" # allows the container to make outbound connections
    enabled: true
    environment-variables:
      set:
        ANSIBLE_CALLBACK_RESULT_FORMAT: yaml # should format the output of stdout to yaml but it is not supported by ansible-navigator - https://github.com/ansible/ansible-navigator/issues/1765
    image: localhost/hikikomori:latest
    pull:
      policy: missing
  logging:
    level: debug
    append: true
    file: logs/ansible-navigator.log
  mode: stdout # defaults to stdout - use the '-m interactive' option to override
  playbook-artifact:
    enable: false # disables artifacts
    save-as: logs/{playbook_name}-artifact-{time_stamp}.json

...
